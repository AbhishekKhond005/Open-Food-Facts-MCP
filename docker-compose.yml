version: "3.8"

services:
  mcp-server:
    build: .
    container_name: mcp-server
    ports:
      - "8081:8081"
    environment:
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8081
      - MCP_ENDPOINT_PATH=/mcp
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
